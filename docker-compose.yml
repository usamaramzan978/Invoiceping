version: "3.9"

services:
  # =============================================================================
  # APP - Main Laravel Application
  # =============================================================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ${APP_NAME}_app
    restart: unless-stopped
    working_dir: /var/www/html

    # Port mapping
    ports:
      - "${APP_PORT:-80}:80"

    # Environment
    env_file:
      - .env
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: ${APP_DEBUG:-false}
      LOG_CHANNEL: ${LOG_CHANNEL:-stack}
      CONTAINER_ROLE: app

    # Volume mounts (use bind mounts for code, named volumes for data)
    volumes:
      - ./:/var/www/html
      - app_logs:/var/www/html/storage/logs

    # Network
    networks:
      - laravel

    # Dependencies
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

    # Health check
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    # Resource limits
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
        reservations:
          cpus: "0.5"
          memory: 256M

  # =============================================================================
  # QUEUE WORKER - Process background jobs
  # =============================================================================
  queue:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ${APP_NAME}_queue
    restart: unless-stopped
    working_dir: /var/www/html

    # Override command for queue worker
    command: >
      sh -c "php artisan queue:work 
      --queue=default,high 
      --sleep=3 
      --tries=3 
      --timeout=90 
      --memory=256"

    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: ${APP_DEBUG:-false}
      LOG_CHANNEL: ${LOG_CHANNEL:-stack}
      CONTAINER_ROLE: queue

    env_file:
      - .env

    volumes:
      - ./:/var/www/html
      - app_logs:/var/www/html/storage/logs

    networks:
      - laravel

    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

    # Resource limits
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
        reservations:
          cpus: "0.5"
          memory: 256M

  # =============================================================================
  # SCHEDULER - Run Laravel scheduled tasks
  # =============================================================================
  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ${APP_NAME}_scheduler
    restart: unless-stopped
    working_dir: /var/www/html

    command: /usr/local/bin/scheduler.sh

    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: ${APP_DEBUG:-false}
      LOG_CHANNEL: ${LOG_CHANNEL:-stack}
      CONTAINER_ROLE: scheduler

    env_file:
      - .env

    volumes:
      - ./:/var/www/html
      - app_logs:/var/www/html/storage/logs

    networks:
      - laravel

    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

    # Resource limits
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.25"
          memory: 128M

  # =============================================================================
  # MYSQL - Database
  # =============================================================================
  mysql:
    image: mysql:8.0.36-debian
    container_name: ${APP_NAME}_mysql
    restart: unless-stopped

    # Security: Use secrets or strong passwords
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_HOST: "%"

    # Port (only expose if necessary, better to use internal network)
    ports:
      - "127.0.0.1:${DB_PORT:-3306}:3306"

    # Volumes
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/my.cnf:ro

    # Network
    networks:
      - laravel

    # Health check
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "127.0.0.1",
          "-u",
          "${DB_USERNAME}",
          "-p${DB_PASSWORD}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

    # Resource limits
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1024M
        reservations:
          cpus: "1"
          memory: 512M

  # =============================================================================
  # REDIS - Cache & Session store
  # =============================================================================
  redis:
    image: redis:7-alpine
    container_name: ${APP_NAME}_redis
    restart: unless-stopped

    # Use custom config for production
    command: redis-server /usr/local/etc/redis/redis.conf

    # Port (only expose if necessary)
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"

    # Volumes
    volumes:
      - redis_data:/data
      - ./docker/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro

    # Network
    networks:
      - laravel

    # Health check
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    # Resource limits
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 256M
        reservations:
          cpus: "0.5"
          memory: 128M

# =============================================================================
# NETWORKS
# =============================================================================
networks:
  laravel:
    driver: bridge
    name: ${APP_NAME}_network

# =============================================================================
# VOLUMES
# =============================================================================
volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local
  app_logs:
    driver: local
